syntax = "proto3";

package Message;

message AudioPacketMessage {
  bytes buffer = 1;
  uint32 sample_rate = 2;
  uint32 channel_count = 3;
  uint32 audio_format = 4;
}

message AudioPacketMessageOrdered {
  uint32 sequence_number = 1;
  AudioPacketMessage audio_packet = 2;
}

message ConnectMessage {}

message MessageWrapper {
  oneof payload {
    AudioPacketMessageOrdered audio_packet = 1;
    ConnectMessage connect = 2;
  }
}

message CaptureHello {
  uint32 protocol_version = 1; // 1
  uint32 capabilities = 2;     // bit0: on-demand capture
  uint32 nonce = 3;
  bool capture_enabled = 4;    // 连接时 PC 的初始需求状态
}

message CaptureControl { bool enabled = 1; }

message CaptureEnvelope {
  oneof payload {
    CaptureHello hello = 1;
    CaptureControl control = 2;
  }
}

message CaptureHelloAck {
  uint32 protocol_version = 1;
  uint32 capabilities = 2;
  uint32 nonce = 3;
}