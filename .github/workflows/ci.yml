name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-rust-app:
    name: Build Rust App on  ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@just

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev libpulse-dev libxkbcommon-dev protobuf-compiler

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        run: choco install protoc -y

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: brew install protobuf --quiet

      - name: Install Rust toolchain
        run: rustup update

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./RustApp -> target"

      - name: Build
        working-directory: ./RustApp
        run: just build-debug

      # The debug binary is what a manual pass of a change runs on a real
      # phone; without it the only way to try a branch is building locally.
      - name: Upload Windows debug binary
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: android-mic-debug-windows
          path: RustApp/target/debug/android-mic.exe
          if-no-files-found: error

  build-android-app:
    name: Build Android App
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Build APK
        working-directory: ./Android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-mic-debug-apk
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
